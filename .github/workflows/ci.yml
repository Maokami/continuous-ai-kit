name: Kit CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check published self-maintenance runtime
        run: python3 -I tests/check_self_runtime.py
      - run: python3 -I -m unittest discover -s tests -v
      - name: Lint workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -ignore 'property "(workflow_sha|workflow_repository)" is not defined in object type'
          python3 -I tests/render_callers.py "$RUNNER_TEMP/cai-callers"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "$RUNNER_TEMP/cai-callers/"*.yml
