name: Continuous AI (kit-maintenance)
on:
  schedule:
    # Monday/Thursday 09:37 KST; enabled after the manual pilot is evaluated.
    - cron: '37 0 * * 1,4'
    # Resume only quota-deferred work from a pilot or regular maintenance.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      batch:
        type: string
        default: auto
      retry_failed:
        type: boolean
        default: false
      reset_quota:
        description: Reset an exhausted quota recovery budget
        type: boolean
        default: false
permissions: {}
concurrency:
  group: continuous-ai-kit-maintenance
  cancel-in-progress: false
jobs:
  scan:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.CAI_QUOTA_RECOVERY_DISABLED != 'true' &&
        (github.event.schedule == '17 * * * *' || vars.CAI_SELF_MAINTENANCE_ENABLED == 'true')))
    permissions:
      contents: read
      issues: write
    uses: Maokami/continuous-ai-kit/.github/workflows/scan-report.yml@d5e38f65feb7dc61a29129d1ae5ee3c990308b55
    with:
      config: .github/continuous-ai/kit-maintenance.json
      default_branch: "main"
      batch: ${{ inputs.batch || 'auto' }}
      retry_failed: ${{ inputs.retry_failed || false }}
      recovery_only: ${{ github.event_name == 'schedule' && github.event.schedule == '17 * * * *' }}
      reset_quota: ${{ inputs.reset_quota || false }}
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
